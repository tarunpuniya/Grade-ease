<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment Gateway - GradeFlow</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e9ecef; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .payment-container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); width: 100%; max-width: 450px; }
        h1 { color: #00224D; text-align: center; margin-bottom: 30px; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        .amount-display { background-color: #f0f7ff; padding: 15px; border-radius: 6px; text-align: center; margin-bottom: 20px; font-size: 1.5em; font-weight: bold; color: #007bff; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input[type="text"], input[type="email"] { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .card-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .card-group input { width: 100%; }
        .pay-btn { width: 100%; padding: 15px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-size: 1.1em; cursor: pointer; transition: background-color 0.3s; }
        .pay-btn:hover { background-color: #218838; }
    </style>
</head>
<body>
    <div class="payment-container">
        <h1>GradeFlow Secure Pay</h1>
        
        <div class="amount-display">
            Amount Due: ₹12,500
        </div>
        
        <form id="paymentForm">
            <label for="name">Name on Card</label>
            <input type="text" id="name" placeholder="" required>

            <label for="cardNumber">Card Number</label>
            <input type="text" id="cardNumber" placeholder="XXXX XXXX XXXX XXXX" maxlength="16" required>
            
            <div class="card-group">
                <div>
                    <label for="expiry">Expiry (MM/YY)</label>
                    <input type="text" id="expiry" placeholder="01/25" maxlength="5" required>
                </div>
                <div>
                    <label for="cvv">CVV</label>
                    <input type="text" id="cvv" placeholder="123" maxlength="3" required>
                </div>
            </div>

            <label for="email">Billing Email</label>
            <input type="email" id="email" placeholder="billing@example.com" required>

            <button type="submit" class="pay-btn">Confirm Payment of ₹12,500</button>
        </form>
    </div>

    <script>
        document.getElementById('paymentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // In a real app, this data would go to a payment gateway API
            // For this mock up, we simulate success after a delay.
            
            const submitButton = document.querySelector('.pay-btn');
            submitButton.disabled = true;
            submitButton.textContent = 'Processing... Please wait';
            submitButton.style.backgroundColor = '#ffc107';

            setTimeout(() => {
                alert('Payment Successful! ₹12,500 has been debited. Returning to Dashboard.');
                
                // Redirect back to the dashboard after mock payment success
                window.location.href = 'student_dashboard.html'; 

            }, 2500); // 2.5 second delay for realism
        });
    </script>
</body>
</html>
